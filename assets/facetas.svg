<rect class="aura" x="286" y="4" width="268" height="150" rx="12" style="animation-delay:1.5s"/><g clip-path="url(#t1)"><rect class="barra" x="226" y="4" width="80" height="150" style="animation-delay:1.5s"/></g>
<rect class="aura" x="568" y="4" width="268" height="150" rx="12" style="animation-delay:3.0s"/><g clip-path="url(#t2)"><rect class="barra" x="508" y="4" width="80" height="150" style="animation-delay:3.0s"/></g>
<rect class="aura" x="4" y="172" width="268" height="150" rx="12" style="animation-delay:4.5s"/><g clip-path="url(#t3)"><rect class="barra" x="-56" y="172" width="80" height="150" style="animation-delay:4.5s"/></g>
<rect class="aura" x="286" y="172" width="268" height="150" rx="12" style="animation-delay:6.0s"/><g clip-path="url(#t4)"><rect class="barra" x="226" y="172" width="80" height="150" style="animation-delay:6.0s"/></g>
<rect class="aura" x="568" y="172" width="268" height="150" rx="12" style="animation-delay:7.5s"/><g clip-path="url(#t5)"><rect class="barra" x="508" y="172" width="80" height="150" style="animation-delay:7.5s"/></g>
</svg>
